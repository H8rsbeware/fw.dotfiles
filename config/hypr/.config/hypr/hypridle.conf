general {
    lock_cmd = pidof hyprlock || hyprlock

    # Covers ALL suspend paths, not only the 15-minute listener.
    before_sleep_cmd = loginctl lock-session

    # Ensure monitors are enabled after resume.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Do not allow suspend until the Wayland lock surface actually exists.
    inhibit_sleep = 3
}

# 14 minutes: lock
listener {
    timeout = 840
    on-timeout = loginctl lock-session
}

# 14m30s: turn displays off
listener {
    timeout = 870
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 minutes: suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
