add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = "[$symbol$branch]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style)) "

[cmd_duration]
min_time = 1000
format = "[$duration]($style)"

[character]
success_symbol = "[❯](bold #cba6f7)"
error_symbol = "[❯](bold #cba6f7)"
vimcmd_symbol = "[❮](bold #cba6f7)"

[zig]
symbol = "↯ "

[golang]
symbol = "go "

[python]
symbol = "py "
